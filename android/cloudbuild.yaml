# Compila y firma el APK en Google Cloud Build (no requiere Android Studio).
# Uso: ./construir_apk.sh construir
substitutions:
  _BUCKET: gs://CAMBIAR-bucket-apk
  _IMAGE: ghcr.io/cirruslabs/android-sdk:34   # imagen pública con el SDK de Android 34 (alternativa: mingc/android-build-box:latest)

steps:
  - id: bajar-llave
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args: ['-c', 'gcloud secrets versions access latest --secret=android-keystore --out-file=/workspace/sanitas.jks']

  - id: compilar
    name: ${_IMAGE}
    entrypoint: bash
    secretEnv: ['KEYSTORE_PASSWORD']
    env:
      - 'KEYSTORE_FILE=/workspace/sanitas.jks'
      - 'KEY_ALIAS=sanitas'
    args:
      - '-c'
      - |
        set -e
        cd /workspace
        chmod +x gradlew
        ./gradlew --no-daemon assembleRelease
        cp app/build/outputs/apk/release/app-release.apk /workspace/sanitas-proveedor.apk

  - id: guardar
    name: gcr.io/cloud-builders/gsutil
    args: ['cp', '/workspace/sanitas-proveedor.apk', '${_BUCKET}/sanitas-proveedor.apk']

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/android-keystore-pass/versions/latest
      env: 'KEYSTORE_PASSWORD'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
timeout: 1800s
