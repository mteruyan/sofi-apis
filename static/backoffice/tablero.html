<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tablero de Tareas - Backoffice</title>
<link rel="icon" type="image/x-icon" href="/assets/favicon_sanitas.ico">
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<style>
  :root {
    --nuevo: #64748b; --asignado: #2563eb; --en_proceso: #d97706;
    --resuelto: #16a34a; --cerrado: #475569; --bg: #f1f5f9;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: #1e293b; }

  /* Login */
  #login-screen { display:flex; align-items:center; justify-content:center; height:100vh; }
  #login-box { background:#fff; padding:32px; border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,.08); width:300px; }
  #login-box h2 { margin-top:0; font-size:18px; }
  #login-box input { width:100%; padding:10px; margin-bottom:10px; border:1px solid #cbd5e1; border-radius:6px; }
  #login-box button { width:100%; padding:10px; background:#2563eb; color:#fff; border:none; border-radius:6px; cursor:pointer; font-weight:600; }
  #login-error { color:#dc2626; font-size:13px; min-height:18px; }

  header { background:#fff; padding:12px 20px; display:flex; justify-content:space-between; align-items:center; box-shadow:0 1px 4px rgba(0,0,0,.06); }
  header h1 { font-size:18px; margin:0; }
  #user-info { display:flex; align-items:center; gap:12px; font-size:14px; }
  #user-info button { background:#e2e8f0; border:none; padding:6px 12px; border-radius:6px; cursor:pointer; }
  #btn-nueva-tarea { background:#2563eb; color:#fff; border:none; padding:8px 16px; border-radius:6px; cursor:pointer; font-weight:600; }

  #board { display:flex; gap:14px; padding:16px; overflow-x:auto; height: calc(100vh - 62px); }
  .column { background:#e9edf3; border-radius:10px; min-width:270px; width:270px; display:flex; flex-direction:column; }
  .column-header { padding:12px; font-weight:700; font-size:13px; text-transform:uppercase; letter-spacing:.03em; display:flex; justify-content:space-between; border-bottom:3px solid; }
  .column-body { flex:1; padding:8px; overflow-y:auto; min-height:100px; }
  .col-NUEVO .column-header { border-color: var(--nuevo); color: var(--nuevo); }
  .col-ASIGNADO .column-header { border-color: var(--asignado); color: var(--asignado); }
  .col-EN_PROCESO .column-header { border-color: var(--en_proceso); color: var(--en_proceso); }
  .col-RESUELTO .column-header { border-color: var(--resuelto); color: var(--resuelto); }
  .col-CERRADO .column-header { border-color: var(--cerrado); color: var(--cerrado); }

  .card { background:#fff; border-radius:8px; padding:10px 12px; margin-bottom:8px; box-shadow:0 1px 3px rgba(0,0,0,.1); cursor:grab; border-left:4px solid #94a3b8; }
  .card:active { cursor:grabbing; }
  .card h4 { margin:0 0 4px; font-size:14px; }
  .card p { margin:2px 0; font-size:12px; color:#64748b; }
  .card .asesor-tag { display:inline-block; margin-top:6px; font-size:11px; background:#eef2ff; color:#4338ca; padding:2px 8px; border-radius:10px; }
  .sortable-ghost { opacity:.4; }

  /* Modal */
  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(15,23,42,.5); align-items:center; justify-content:center; z-index:50; }
  .modal { background:#fff; width:480px; max-width:92vw; max-height:88vh; overflow-y:auto; border-radius:12px; padding:20px; }
  .modal h3 { margin-top:0; }
  .modal label { font-size:12px; font-weight:600; color:#475569; display:block; margin-top:10px; }
  .modal input, .modal select, .modal textarea { width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:6px; margin-top:4px; font-family:inherit; }
  .modal-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:16px; }
  .btn { padding:8px 14px; border-radius:6px; border:none; cursor:pointer; font-weight:600; }
  .btn-primary { background:#2563eb; color:#fff; }
  .btn-secondary { background:#e2e8f0; }
  .evento { border-left:2px solid #e2e8f0; padding:6px 0 6px 10px; margin-top:8px; font-size:13px; }
  .evento .meta { color:#94a3b8; font-size:11px; }
</style>
</head>
<body>

<div id="login-screen">
  <div id="login-box">
    <h2>Backoffice - Ingreso</h2>
    <input id="login-usuario" placeholder="Usuario">
    <input id="login-password" type="password" placeholder="Contraseña">
    <div id="login-error"></div>
    <button onclick="doLogin()">Ingresar</button>
    <div style="text-align:center; margin-top:10px;">
      <a href="#" onclick="abrirModalReset(); return false;" style="font-size:12px; color:#2563eb;">¿Olvidaste tu contraseña?</a>
    </div>
  </div>
</div>

<div id="app" style="display:none;">
  <header>
    <h1>Tablero de Tareas</h1>
    <div id="user-info">
      <button id="btn-nueva-tarea" onclick="abrirModalNuevaTarea()">+ Nueva tarea</button>
      <span id="nombre-usuario"></span>
      <button onclick="doLogout()">Salir</button>
    </div>
  </header>
  <div id="board"></div>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal-content"></div>
</div>

<script>
const API_BASE = "https://sntspe.com/backoffice"; // <-- ajustar a la URL real de sofi-apis
const ESTADOS = ["NUEVO", "ASIGNADO", "EN_PROCESO", "RESUELTO", "CERRADO"];
const ESTADO_LABEL = {NUEVO:"Nuevo", ASIGNADO:"Asignado", EN_PROCESO:"En Proceso", RESUELTO:"Resuelto", CERRADO:"Cerrado"};

let sesion = JSON.parse(localStorage.getItem("bo_sesion") || "null");
let asesoresCache = [];

function api(path, opts = {}) {
  const headers = { "Content-Type": "application/json" };
  if (sesion && sesion.token) headers["Authorization"] = "Bearer " + sesion.token;
  return fetch(API_BASE + path, { headers, ...opts }).then(async r => {
    if (r.status === 401) { localStorage.removeItem("bo_sesion"); location.reload(); }
    return r.json();
  });
}

async function doLogin() {
  const usuario = document.getElementById("login-usuario").value.trim();
  const password = document.getElementById("login-password").value;
  const res = await fetch(API_BASE + "/login", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ usuario, password }),
  }).then(r => r.json());
  if (!res.ok) {
    document.getElementById("login-error").textContent = res.error || "Error de ingreso";
    return;
  }
  sesion = { asesor: res.asesor, token: res.token };
  localStorage.setItem("bo_sesion", JSON.stringify(sesion));
  mostrarApp();
}

function abrirModalReset() {
  abrirModal(`
    <h3>Restablecer contraseña</h3>
    <p style="font-size:13px; color:#64748b;">Ingresa tu usuario. Si tienes celular registrado, te llegará un código por SMS.</p>
    <label>Usuario</label><input id="reset-usuario">
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="cerrarModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="solicitarCodigoReset()">Enviar código</button>
    </div>
  `);
}

async function solicitarCodigoReset() {
  const usuario = document.getElementById("reset-usuario").value.trim();
  if (!usuario) return;
  const res = await fetch(API_BASE + "/solicitar-reset", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ usuario }),
  }).then(r => r.json());

  abrirModal(`
    <h3>Restablecer contraseña</h3>
    <p style="font-size:13px; color:#16a34a;">${res.mensaje || "Código enviado."}</p>
    <label>Código recibido por SMS</label><input id="reset-codigo" maxlength="6">
    <label>Nueva contraseña</label><input id="reset-nueva-password" type="password">
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="cerrarModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="confirmarReset('${usuario}')">Cambiar contraseña</button>
    </div>
  `);
}

async function confirmarReset(usuario) {
  const codigo = document.getElementById("reset-codigo").value.trim();
  const nueva_password = document.getElementById("reset-nueva-password").value;
  const res = await fetch(API_BASE + "/confirmar-reset", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ usuario, codigo, nueva_password }),
  }).then(r => r.json());

  if (!res.ok) { alert(res.error || "No se pudo cambiar la contraseña"); return; }
  cerrarModal();
  alert("Contraseña actualizada. Ya puedes iniciar sesión con tu nueva clave.");
}

async function doLogout() {
  if (sesion) {
    await api("/logout", { method: "POST" });
  }
  localStorage.removeItem("bo_sesion");
  location.reload();
}

function mostrarApp() {
  document.getElementById("login-screen").style.display = "none";
  document.getElementById("app").style.display = "block";
  document.getElementById("nombre-usuario").textContent = sesion.asesor.nombre;
  cargarTablero();
  cargarAsesores();
}

function renderBoard() {
  const board = document.getElementById("board");
  board.innerHTML = "";
  ESTADOS.forEach(estado => {
    const col = document.createElement("div");
    col.className = `column col-${estado}`;
    col.innerHTML = `<div class="column-header"><span>${ESTADO_LABEL[estado]}</span><span id="count-${estado}">0</span></div>
                      <div class="column-body" id="col-body-${estado}" data-estado="${estado}"></div>`;
    board.appendChild(col);
  });
  ESTADOS.forEach(estado => {
    Sortable.create(document.getElementById(`col-body-${estado}`), {
      group: "tareas", animation: 150,
      onAdd: async (evt) => {
        const tareaId = evt.item.dataset.id;
        await api(`/tareas/${tareaId}`, { method: "PUT", body: JSON.stringify({ estado, actualizado_por: sesion.asesor.id }) });
        cargarTablero();
      }
    });
  });
}

async function cargarTablero() {
  renderBoard();
  const res = await api("/tareas");
  if (!res.ok) return;
  const conteo = {};
  res.tareas.forEach(t => {
    conteo[t.estado] = (conteo[t.estado] || 0) + 1;
    const body = document.getElementById(`col-body-${t.estado}`);
    if (!body) return;
    const card = document.createElement("div");
    card.className = "card";
    card.dataset.id = t.id;
    card.onclick = () => abrirDetalleTarea(t.id);
    card.innerHTML = `
      <h4>${t.cliente_nombre}</h4>
      <p>DNI: ${t.cliente_dni || "-"} · ${t.cliente_celular || "-"}</p>
      <p>${(t.descripcion || "").slice(0, 60)}${t.descripcion.length > 60 ? "..." : ""}</p>
      ${t.asesor_nombre ? `<span class="asesor-tag">${t.asesor_nombre}</span>` : ""}
    `;
    body.appendChild(card);
  });
  ESTADOS.forEach(e => document.getElementById(`count-${e}`).textContent = conteo[e] || 0);
}

async function cargarAsesores() {
  const res = await api("/asesores");
  if (res.ok) asesoresCache = res.asesores.filter(a => a.estado === "ACTIVO");
}

function abrirModal(html) {
  document.getElementById("modal-content").innerHTML = html;
  document.getElementById("modal-overlay").style.display = "flex";
}
function cerrarModal() {
  document.getElementById("modal-overlay").style.display = "none";
}

function abrirModalNuevaTarea() {
  abrirModal(`
    <h3>Nueva tarea</h3>
    <label>Nombre completo del cliente</label><input id="f-nombre">
    <label>DNI</label><input id="f-dni">
    <label>Celular</label><input id="f-celular">
    <label>Correo</label><input id="f-correo">
    <label>Descripción de la tarea</label><textarea id="f-desc" rows="3"></textarea>
    <label>Asignar a (opcional)</label>
    <select id="f-asesor"><option value="">Sin asignar</option>
      ${asesoresCache.map(a => `<option value="${a.id}">${a.nombre_completo}</option>`).join("")}
    </select>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="cerrarModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="guardarNuevaTarea()">Crear tarea</button>
    </div>
  `);
}

async function guardarNuevaTarea() {
  const body = {
    cliente_nombre: document.getElementById("f-nombre").value,
    cliente_dni: document.getElementById("f-dni").value,
    cliente_celular: document.getElementById("f-celular").value,
    cliente_correo: document.getElementById("f-correo").value,
    descripcion: document.getElementById("f-desc").value,
    asesor_id: document.getElementById("f-asesor").value || null,
  };
  const res = await api("/tareas", { method: "POST", body: JSON.stringify(body) });
  if (res.ok) { cerrarModal(); cargarTablero(); }
}

async function abrirDetalleTarea(id) {
  const res = await api(`/tareas/${id}`);
  if (!res.ok) return;
  const t = res.tarea;
  abrirModal(`
    <h3>${t.cliente_nombre}</h3>
    <p><b>DNI:</b> ${t.cliente_dni || "-"} · <b>Celular:</b> ${t.cliente_celular || "-"} · <b>Correo:</b> ${t.cliente_correo || "-"}</p>
    <p>${t.descripcion}</p>
    <label>Estado</label>
    <select id="f-estado">${ESTADOS.map(e => `<option value="${e}" ${e===t.estado?"selected":""}>${ESTADO_LABEL[e]}</option>`).join("")}</select>
    <label>Asesor</label>
    <select id="f-reasignar"><option value="">Sin asignar</option>
      ${asesoresCache.map(a => `<option value="${a.id}" ${a.id===t.asesor_id?"selected":""}>${a.nombre_completo}</option>`).join("")}
    </select>
    <label>Agregar actualización</label>
    <textarea id="f-nuevo-comentario" rows="2" placeholder="Escribe una actualización..."></textarea>
    <div style="max-height:180px; overflow-y:auto; margin-top:10px;">
      ${t.eventos.map(ev => `
        <div class="evento">
          <div class="meta">${ev.asesor_nombre || "Sistema"} · ${new Date(ev.fecha).toLocaleString("es-PE")}</div>
          ${ev.tipo === "CAMBIO_ESTADO" ? `Cambió estado de <b>${ESTADO_LABEL[ev.estado_anterior]||ev.estado_anterior}</b> a <b>${ESTADO_LABEL[ev.estado_nuevo]||ev.estado_nuevo}</b>` : (ev.comentario || ev.tipo)}
        </div>`).join("")}
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="cerrarModal()">Cerrar</button>
      <button class="btn btn-primary" onclick="guardarDetalleTarea(${t.id})">Guardar</button>
    </div>
  `);
}

async function guardarDetalleTarea(id) {
  const estado = document.getElementById("f-estado").value;
  const asesor_id = document.getElementById("f-reasignar").value || null;
  const comentario = document.getElementById("f-nuevo-comentario").value.trim();

  await api(`/tareas/${id}`, { method: "PUT", body: JSON.stringify({ estado, asesor_id, actualizado_por: sesion.asesor.id }) });
  if (comentario) {
    await api(`/tareas/${id}/comentarios`, { method: "POST", body: JSON.stringify({ comentario, asesor_id: sesion.asesor.id }) });
  }
  cerrarModal();
  cargarTablero();
}

document.getElementById("modal-overlay").addEventListener("click", (e) => {
  if (e.target.id === "modal-overlay") cerrarModal();
});

if (sesion) mostrarApp();
</script>
</body>
</html>
