<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Marca tu ubicación</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{ --navy:#003876; --teal:#0f8f7e; --line:#d7dde5; --danger:#c0392b; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; color:#10221f; background:#f4f7f6; }
  .wrap{ display:flex; flex-direction:column; height:100%; max-width:560px; margin:0 auto; background:#fff; }
  header{ background:var(--navy); color:#fff; padding:14px 16px; }
  header b{ font-size:17px; }
  header div{ font-size:13px; opacity:.9; margin-top:2px; }
  #dir{ padding:10px 16px; font-size:13.5px; background:#eef6f2; border-bottom:1px solid var(--line); display:none; }
  #map{ flex:1; min-height:240px; }
  .panel{ padding:12px 16px calc(12px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); }
  button{ width:100%; border:none; border-radius:12px; padding:14px; font-size:16px; font-weight:700; cursor:pointer; }
  #btnGps{ background:#fff; color:var(--navy); border:1.5px solid var(--navy); margin-bottom:8px; }
  #btnOk{ background:var(--teal); color:#fff; }
  button:disabled{ opacity:.5; }
  #msg{ font-size:13px; color:#5b6f6a; margin-bottom:8px; min-height:18px; }
  #msg.err{ color:var(--danger); }
  .final{ padding:40px 24px; text-align:center; display:none; }
  .final .ic{ font-size:54px; }
  .final h2{ margin:10px 0 6px; }
  footer{ font-size:12.5px; text-align:center; color:#5b6f6a; padding:0 16px 10px; }
  footer a{ color:var(--navy); font-weight:600; }
</style>
</head>
<body>
<div class="wrap" id="app">
  <header><b>📍 ¿Dónde te enviamos al médico?</b><div>Mueve el pin hasta la puerta de tu domicilio y confirma.</div></header>
  <div id="dir"></div>
  <div id="map"></div>
  <div class="panel">
    <div id="msg">Toca el mapa o arrastra el pin. Puedes acercar el mapa con dos dedos.</div>
    <button id="btnGps">🎯 Usar mi ubicación actual</button>
    <button id="btnOk" disabled>Confirmar esta ubicación</button>
  </div>
  <footer>¿Problemas? Llama a Sanitas · <a href="tel:+5112191919">219-1919</a></footer>
</div>
<div class="wrap final" id="final"><div class="ic" id="fIc">✅</div><h2 id="fTit"></h2><p id="fTxt"></p></div>

<script>
const token = location.pathname.split('/').filter(Boolean).pop();
const $ = id => document.getElementById(id);
let map, pin = null, precision = null, yaEnviada = false;

function final(ic, tit, txt){
  $('app').style.display = 'none'; const f = $('final'); f.style.display = 'block';
  $('fIc').textContent = ic; $('fTit').textContent = tit; $('fTxt').textContent = txt;
}
function msg(t, err){ const m = $('msg'); m.textContent = t; m.className = err ? 'err' : ''; }

function ponerPin(latlng, centrar){
  if (!pin){
    pin = L.marker(latlng, { draggable:true }).addTo(map);
    pin.on('dragend', () => { precision = null; msg('Ubicación ajustada. Si es la puerta de tu casa, confirma.'); });
  } else pin.setLatLng(latlng);
  if (centrar) map.setView(latlng, 18);
  $('btnOk').disabled = false;
}

(async () => {
  let info;
  try {
    const r = await fetch(`/track/u/${encodeURIComponent(token)}/info`);
    if (!r.ok) return final('⚠️', 'Enlace no válido', 'Pide a Sanitas que te envíe uno nuevo. Llama al 219-1919.');
    info = await r.json();
  } catch (e) { return final('📶', 'Sin conexión', 'Revisa tu internet y abre de nuevo el enlace.'); }
  if (info.expirada) return final('⌛', 'Este enlace venció', 'Pide a Sanitas que te envíe uno nuevo. Llama al 219-1919.');

  if (info.direccion){ $('dir').style.display = 'block'; $('dir').textContent = 'Dirección indicada: ' + info.direccion; }
  const c = info.centro ? [info.centro.lat, info.centro.lng] : [-12.0464, -77.0428];
  map = L.map('map', { zoomControl:true }).setView(c, info.centro ? 17 : 12);
  map.attributionControl.setPrefix(false);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19, attribution:'&copy; OpenStreetMap' }).addTo(map);
  if (info.centro) ponerPin(L.latLng(c[0], c[1]), false);
  map.on('click', e => { precision = null; ponerPin(e.latlng, false); msg('Ubicación marcada. Arrastra el pin si necesitas afinarla.'); });
  setTimeout(() => map.invalidateSize(), 200);
})();

$('btnGps').onclick = () => {
  if (!navigator.geolocation) return msg('Tu navegador no permite usar la ubicación. Toca el mapa para marcarla.', true);
  msg('Buscando tu ubicación…');
  navigator.geolocation.getCurrentPosition(p => {
    precision = p.coords.accuracy;
    ponerPin(L.latLng(p.coords.latitude, p.coords.longitude), true);
    msg(precision > 80 ? 'Ubicación aproximada. Arrastra el pin hasta tu puerta.' : 'Listo. Verifica que el pin esté en tu domicilio y confirma.');
  }, () => msg('No pudimos obtener tu ubicación. Activa el permiso o toca el mapa para marcarla.', true),
  { enableHighAccuracy:true, timeout:15000, maximumAge:0 });
};

$('btnOk').onclick = async () => {
  if (!pin) return;
  const b = $('btnOk'); b.disabled = true; b.textContent = 'Enviando…';
  try {
    const ll = pin.getLatLng();
    const r = await fetch(`/track/u/${encodeURIComponent(token)}/enviar`, {
      method:'POST', headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ lat: ll.lat, lng: ll.lng, precision_m: precision })
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok){ msg(d.error || 'No se pudo enviar. Intenta de nuevo.', true); b.disabled = false; b.textContent = 'Confirmar esta ubicación'; return; }
    final('✅', '¡Ubicación enviada!', 'Gracias. Sanitas ya la recibió y continuará con tu solicitud.');
  } catch (e) {
    msg('Sin conexión. Intenta de nuevo.', true); b.disabled = false; b.textContent = 'Confirmar esta ubicación';
  }
};
</script>
</body>
</html>
